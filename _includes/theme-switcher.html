<div class="theme-switcher" role="group" aria-label="Color theme">

    <svg class="theme-switcher__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">

      <rect
        x="4"
        y="5"

        height="11"

      <path
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        d="M8 19h8M12 16v3"
